# Supabase CLI local development config.
# Values here affect LOCAL dev only; staging/prod are configured in the dashboard.
project_id = "yodkai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "yodkai://"
additional_redirect_urls = ["yodkai://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
# Local dev: use test OTP below instead of a real SMS provider.
enable_signup = true
enable_confirmations = true

[auth.sms.test_otp]
# Any of these numbers signs in with OTP 123456 in local dev.
"66900000001" = "123456"
"66900000002" = "123456"

[realtime]
enabled = true

[edge_runtime]
enabled = true

[analytics]
# Disabled: the analytics (logflare/vector) container needs the Docker daemon
# exposed on tcp://localhost:2375, which is off by default on Windows and drags
# the whole `supabase start` down. Not needed for local dev.
enabled = false
